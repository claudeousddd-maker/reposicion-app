name: Crear APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir proyecto
          unzip -q *.zip -d proyecto
          find proyecto -name gradlew -type f -exec chmod +x {} \;

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ReposicionApp
          path: proyecto/**/build/outputs/apk/debug/*.apk
