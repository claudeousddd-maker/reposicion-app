name: Crear APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir proyecto
          unzip -q *.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar proyecto Android
        run: |
          SETTINGS=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle"
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Proyecto encontrado en: $(dirname "$SETTINGS")"

      - name: Compilar APK
        run: |
          SETTINGS=$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ReposicionApp
          path: proyecto/**/build/outputs/apk/debug/*.apk
